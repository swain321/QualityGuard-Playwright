name: QualityGuard Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run automated tests
        run: npx playwright test

      - name: Upload HTML report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualityguard-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14